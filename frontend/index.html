<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ODVUT Crypto API Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px 15px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            background: #292929;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
        }

        .source {
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>ODVUT Crypto API Demo</h1>

    <div class="status" id="backend">
        Backend: Checking...
    </div>

    <h2>BTC/USDT</h2>

    <div class="price" id="price">
        —
    </div>

    <div class="source" id="source">
        Source: —
    </div>

    <button onclick="getPrice()">
        Get Live BTC Price
    </button>

    <div class="error" id="error"></div>

</div>


<script>

async function checkBackend() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();

        if (data.status === "online") {

            document.getElementById("backend")
                .innerHTML =
                "Backend: 🟢 Online";

        } else {

            document.getElementById("backend")
                .innerHTML =
                "Backend: 🔴 Error";
        }

    } catch (error) {

        document.getElementById("backend")
            .innerHTML =
            "Backend: 🔴 Error";
    }
}


async function getPrice() {

    const priceElement =
        document.getElementById("price");

    const sourceElement =
        document.getElementById("source");

    const errorElement =
        document.getElementById("error");

    priceElement.innerText = "Loading...";
    sourceElement.innerText = "Source: —";
    errorElement.innerText = "";

    try {

        const response =
            await fetch("/api/price");

        const data =
            await response.json();

        console.log("Price API:", data);

        if (data.status === "success") {

            priceElement.innerText =
                "$" +
                Number(data.price)
                    .toLocaleString(
                        undefined,
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    );

            sourceElement.innerText =
                "Source: " +
                data.source;

            if (data.fallback) {

                errorElement.innerText =
                    "Binance unavailable — using Bybit fallback.";

            }

        } else {

            priceElement.innerText = "—";

            errorElement.innerText =
                "Binance: " +
                (data.binance_error || "Failed") +
                " | Bybit: " +
                (data.bybit_error || "Failed");
        }

    } catch (error) {

        priceElement.innerText = "—";

        errorElement.innerText =
            "Request failed: " + error.message;
    }
}


checkBackend();

</script>

</body>
</html>
