<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODVUT API Test</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px}.box{max-width:700px;margin:auto;background:#1d1d1d;padding:22px;border-radius:15px}button{padding:13px 20px;border:0;border-radius:8px;font-size:16px}.card{background:#292929;padding:14px;margin:10px 0;border-radius:9px}.ok{color:#70e070}.bad{color:#ff7070}.skip{color:#ffd166}.err{word-break:break-word;color:#ff7070}.meta{color:#aaa;font-size:13px}</style></head>
<body><div class="box"><h1>ODVUT Market API Test</h1><p>These requests run from the Render server. Phone VPN does not affect them.</p><button onclick="run()">Test All APIs</button><div id="out">Press the button.</div></div>
<script>
async function run(){let o=document.getElementById("out");o.innerHTML="Testing...";try{let r=await fetch("/api/test-apis"),d=await r.json();let h="<p><b>Working APIs: "+d.working_count+"</b></p>";for(let [n,x] of Object.entries(d.results)){let c=x.ok===true?"ok":x.ok===null?"skip":"bad",s=x.ok===true?"✅ WORKING":x.ok===null?"⚪ NOT CONFIGURED":"❌ FAILED";h+=`<div class="card"><b>${n}</b> — <span class="${c}">${s}</span><div class="meta">HTTP: ${x.http_status??"—"} | ${x.latency_ms??"—"} ms</div>${x.price!==undefined?"<div>BTC price: $"+Number(x.price).toLocaleString()+"</div>":""}${x.error?'<div class="err">'+x.error+"</div>":""}</div>`}o.innerHTML=h}catch(e){o.innerHTML="<div class='err'>"+e.message+"</div>"}}</script></body></html>
